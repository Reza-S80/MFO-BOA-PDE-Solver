name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # 3.12, not 3.10: the pinned numpy==2.5.4 / scipy==1.18.1 require
        # Python >= 3.12 (see requirements.txt). Do not lower this without
        # re-resolving and re-testing the pins.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
